<script>
	function getActiveSectionIndex(sections) {
		return Array.from(sections).findIndex(element => {
		  const { top, bottom } = element.getBoundingClientRect()
		  return bottom > 0 && top < window.innerHeight
		});
	}

	function handleKeyPress(sections, direction) {
		const nextSection = getActiveSectionIndex(sections) + direction;
		if (0 <= nextSection && nextSection < sections.length) {
			sections[nextSection].scrollIntoView({behavior: "smooth"});
		}
	}

	document.addEventListener("DOMContentLoaded", function() {
		const sections = document.querySelectorAll("section");

		document.addEventListener("keydown", function (evt) {
			let direction = Number.NaN;
			if (evt.key === "ArrowDown") {
				direction = 1;
			} else if (evt.key === "ArrowUp") {
				direction = -1;
			}
			if (!Number.isNaN(direction)) {
				evt.preventDefault()
				handleKeyPress(sections, direction)
			}
		})
	})
</script>
